[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "math-knowledge-engine"
version = "0.1.0"
description = "Mathematical Verification Foundation for Algebraic Equations (DEV-01)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Math Knowledge Engine Research Team"}
]
keywords = ["mathematics", "computer-algebra", "verification", "algebraic-equations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy==1.14.0",
    "pydantic==2.13.5",
    "typer==0.25.1",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
mke = "mke.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
